name: CI - WebUI

# The qBittorrent-WARP fork does not modify the Web UI, so this only ever tests
# upstream code; any failure here is an upstream issue, fixed upstream and pulled
# in by the auto-update merge. Run on demand only to conserve a private repo's
# Actions minutes.
on: workflow_dispatch

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.head_ref != '' }}

jobs:
  ci:
    name: Check
    runs-on: ubuntu-slim
    permissions:
      contents: read
      security-events: write

    defaults:
      run:
        working-directory: src/webui/www

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup nodejs
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install tools
        run: |
          npm install
          npm ls
          echo "::group::npm ls --all"
          npm ls --all
          echo "::endgroup::"

      - name: Run tests
        run: npm test

      - name: Lint code
        if: ${{ !cancelled() && !github.event.repository.private }}
        run: npm run lint

      - name: Format code
        if: ${{ !cancelled() && !github.event.repository.private }}
        run: |
          npm run format
          git diff --exit-code

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        if: ${{ !cancelled() && !github.event.repository.private }}
        with:
          config-file: .github/workflows/helper/codeql/js.yaml
          languages: javascript

      - name: Run CodeQL analysis
        if: ${{ !cancelled() && !github.event.repository.private }}
        uses: github/codeql-action/analyze@v4.37.3
