name: Auto-update from upstream

# Tracks upstream qBittorrent and keeps the fork current without manual work.
# Every day it finds the latest upstream STABLE release and opens a pull request
# that merges it into the warp branch. When the merge is conflict-free it arms
# auto-merge, so GitHub merges the PR once the required checks pass and the
# review bot approves the head commit (see the warp ruleset). The merge push
# then triggers release.yaml. When the merge would conflict (usually only in
# src/base/bittorrent/sessionimpl.cpp) the pull request is left open for manual
# resolution and auto-merge is not armed.
#
# The checkout and gh steps authenticate with the personal access token in the
# secret AUTOUPDATE_TOKEN. It needs the workflow scope, because an upstream
# release that changes a file under .github/workflows/ cannot be pushed with the
# built-in token. It also makes the pull request trigger CI and the merge
# trigger release.yaml, which the built-in token suppresses (GitHub's
# anti-recursion rule).
#
# The upstream history must stay intact, so this PR is merged with a merge
# commit, never squashed.

on:
  schedule:
    - cron: "0 6 * * *"   # everyday at 06:00 UTC (00:00 CST, 01:00 CDT)
  workflow_dispatch: # also runnable on demand from the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    name: Sync upstream stable release
    runs-on: ubuntu-latest

    steps:
      - name: Require AUTOUPDATE_TOKEN
        env:
          AUTOUPDATE_TOKEN: ${{ secrets.AUTOUPDATE_TOKEN }}
        run: |
          [ -n "$AUTOUPDATE_TOKEN" ] || { echo "::error::The AUTOUPDATE_TOKEN secret is not set."; exit 1; }

      - name: Checkout the warp branch
        uses: actions/checkout@v7
        with:
          ref: warp
          fetch-depth: 0
          token: ${{ secrets.AUTOUPDATE_TOKEN }}

      - name: Open the upstream update and arm auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTOUPDATE_TOKEN }}
          # Pin gh to this repo; the script adds an "upstream" remote, which gh
          # would otherwise treat as the pull request's base repository.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          upstream="https://github.com/qbittorrent/qBittorrent.git"

          # Latest upstream stable (non-prerelease) release tag.
          tag="$(gh api repos/qbittorrent/qBittorrent/releases/latest --jq .tag_name)"
          echo "Latest upstream stable release: $tag"

          git remote add upstream "$upstream" 2>/dev/null || git remote set-url upstream "$upstream"
          git fetch --no-tags upstream "refs/tags/${tag}:refs/upstream/${tag}"
          tagsha="$(git rev-parse "refs/upstream/${tag}")"

          if git merge-base --is-ancestor "$tagsha" HEAD; then
            echo "The warp branch already contains ${tag}; nothing to do."
            exit 0
          fi

          branch="auto-update/${tag}"

          # Leave an open PR alone: a daily force-push would restart CI and the
          # review, and would overwrite a manual conflict resolution.
          if [ "$(gh pr view "$branch" --json state --jq .state 2>/dev/null || true)" = "OPEN" ]; then
            echo "A pull request for ${tag} is already open; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Build the update as an ordinary descendant of warp, then push that.
          # Pushing the upstream commit directly fails ("fatal error in
          # commit_refs"): it is foreign history carrying its own
          # .github/workflows files, which a token may not introduce that way.
          # Merging it on the runner keeps the push a normal branch update, and
          # the merge result tells us locally whether it was clean.
          git checkout -B "$branch" warp
          if git merge --no-edit "$tagsha"; then
            conflicts=0
          else
            # Commit the conflicted tree so the markers show up on the PR for a
            # person to resolve; this case is never merged automatically below.
            conflicts=1
            git add -A
            git commit --no-edit
          fi
          git push --force origin "$branch"

          # Open the PR if one does not already exist for this branch. A freshly
          # pushed branch can take a moment to become visible to the PR API, so
          # retry until the create succeeds.
          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            printf '%s\n' \
              "Automated sync of upstream qBittorrent stable \`${tag}\` into the \`warp\` branch." \
              "" \
              "When the merge is clean, auto-merge is armed and GitHub merges this PR after the required checks pass and the review bot approves the head commit. When it conflicts, the conflict markers are committed to the branch for manual resolution (usually only in \`src/base/bittorrent/sessionimpl.cpp\`)." \
              > pr-body.md
            for _ in $(seq 1 10); do
              gh pr create \
                --base warp --head "$branch" \
                --title "Update to qBittorrent ${tag}" \
                --body-file pr-body.md && break
              sleep 6
            done
          fi

          if [ "$conflicts" -eq 0 ]; then
            warp/arm-automerge.sh "$branch" merge
            echo "Auto-merge armed for ${tag}."
          else
            echo "::warning::${tag} does not merge cleanly into warp. The conflict markers are committed to the pull request, which has been left open for manual resolution."
          fi
