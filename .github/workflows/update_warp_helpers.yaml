name: Update WARP engine helpers

# Keeps the bundled Cloudflare WARP engine helpers current with no manual work,
# in the same way as auto_update.yaml. The fork does not ship the helpers; it
# pins their versions, download URLs and SHA-256 sums in
# src/base/bittorrent/warpengine.cpp and the client downloads and verifies them
# at runtime (see warp/THIRD-PARTY-NOTICES.md). Every day this finds the latest
# release of each helper, reads the published checksums, runs the binaries once
# on the runner, rewrites the pins, opens a pull request and arms auto-merge.
#
# GitHub merges the PR once the required checks pass and the review bot
# approves the head commit (see the warp ruleset). The merge is a push to warp
# touching src/, which triggers release.yaml to publish a build with the new
# pins. The steps authenticate with the AUTOUPDATE_TOKEN personal access token,
# so the PR runs CI and the merge triggers the release workflow; the built-in
# token does neither.
#
# Helpers tracked, pinned for both architectures the fork ships (x86_64 and
# arm64):
#   * wgcf      - ViRb3/wgcf            (each asset is the binary itself)
#   * wireproxy - pufferffish/wireproxy (each asset is a .tar.gz of the binary)

on:
  schedule:
    - cron: "0 7 * * *"   # everyday at 07:00 UTC (01:00 CST, 02:00 CDT)
  workflow_dispatch:

permissions:
  contents: read # the PAT does all writes
  pull-requests: read # find an open PR for the branch

concurrency:
  group: update-warp-helpers
  cancel-in-progress: false

jobs:
  find:
    name: Find and verify new helpers
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.pins.outputs.changed }}
      branch: ${{ steps.pins.outputs.branch }}
      cur_wgcf: ${{ steps.pins.outputs.cur_wgcf }}
      cur_wp: ${{ steps.pins.outputs.cur_wp }}
      wgcf_tag: ${{ steps.pins.outputs.wgcf_tag }}
      wgcf_ver: ${{ steps.pins.outputs.wgcf_ver }}
      wgcf_sha_amd64: ${{ steps.pins.outputs.wgcf_sha_amd64 }}
      wgcf_sha_arm64: ${{ steps.pins.outputs.wgcf_sha_arm64 }}
      wp_tag: ${{ steps.pins.outputs.wp_tag }}
      wp_ver: ${{ steps.pins.outputs.wp_ver }}
      wp_arc_amd64: ${{ steps.pins.outputs.wp_arc_amd64 }}
      wp_bin_amd64: ${{ steps.pins.outputs.wp_bin_amd64 }}
      wp_arc_arm64: ${{ steps.pins.outputs.wp_arc_arm64 }}
      wp_bin_arm64: ${{ steps.pins.outputs.wp_bin_arm64 }}

    steps:
      - name: Checkout the warp branch
        uses: actions/checkout@v7
        with:
          ref: warp
          persist-credentials: false

      # The downloaded helper binaries run in this job, which has no personal
      # access token. The job that holds the token never runs them.
      - name: Find new helper releases and verify them
        id: pins
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"

          src="src/base/bittorrent/warpengine.cpp"

          # Latest releases and the versions currently pinned in the source.
          wgcf_tag="$(gh api repos/ViRb3/wgcf/releases/latest --jq .tag_name)"
          wp_tag="$(gh api repos/pufferffish/wireproxy/releases/latest --jq .tag_name)"
          wgcf_ver="${wgcf_tag#v}"
          wp_ver="${wp_tag#v}"
          cur_wgcf="$(grep -oP '(?<=// wgcf )\S+' "$src" | head -1)"
          cur_wp="$(grep -oP '(?<=// wireproxy )\S+' "$src" | head -1)"
          echo "wgcf: pinned ${cur_wgcf}, latest ${wgcf_ver}"
          echo "wireproxy: pinned ${cur_wp}, latest ${wp_ver}"

          if [ "$wgcf_ver" = "$cur_wgcf" ] && [ "$wp_ver" = "$cur_wp" ]; then
            echo "Both helpers are already up to date; nothing to do."
            exit 0
          fi

          branch="update-warp-helpers/wgcf-${wgcf_ver}-wireproxy-${wp_ver}"

          # Leave an open PR alone so a daily force-push does not restart CI and
          # the review.
          if [ "$(gh pr view "$branch" --json state --jq .state 2>/dev/null || true)" = "OPEN" ]; then
            echo "A pull request for wgcf ${wgcf_ver} and wireproxy ${wp_ver} is already open; nothing to do."
            exit 0
          fi

          work="$(mktemp -d)"

          # Reads a SHA-256 out of a downloaded checksums.txt by asset name; fails
          # if the asset is missing so a renamed release does not slip through.
          sum_for() {
            local sums="$1" asset="$2" sha
            sha="$(awk -v f="$asset" '{n=$2; sub(/^\*/, "", n); if (n == f) print $1}' "$sums")"
            [ -n "$sha" ] || { echo "::error::no checksum for ${asset}"; return 1; }
            printf '%s' "$sha"
          }

          # Both helpers are pinned for the two architectures the fork ships:
          # x86_64 (desktop) and arm64 (headless Raspberry Pi). The checksums come
          # from each release's published checksums.txt and are pinned exactly as
          # warpengine.cpp verifies them at runtime.

          # wgcf: the release asset is the binary itself, one per architecture.
          curl -fsSL "https://github.com/ViRb3/wgcf/releases/download/${wgcf_tag}/checksums.txt" -o "${work}/wgcf.sums"
          wgcf_sha_amd64="$(sum_for "${work}/wgcf.sums" "wgcf_${wgcf_ver}_linux_amd64")"
          wgcf_sha_arm64="$(sum_for "${work}/wgcf.sums" "wgcf_${wgcf_ver}_linux_arm64")"
          curl -fsSL "https://github.com/ViRb3/wgcf/releases/download/${wgcf_tag}/wgcf_${wgcf_ver}_linux_amd64" -o "${work}/wgcf.amd64"
          curl -fsSL "https://github.com/ViRb3/wgcf/releases/download/${wgcf_tag}/wgcf_${wgcf_ver}_linux_arm64" -o "${work}/wgcf.arm64"
          echo "${wgcf_sha_amd64}  ${work}/wgcf.amd64" | sha256sum -c -
          echo "${wgcf_sha_arm64}  ${work}/wgcf.arm64" | sha256sum -c -

          # wireproxy: the release asset is a .tar.gz holding the binary. Pin both
          # the archive sum (verified before unpacking) and the binary sum
          # (verified before execution) for each architecture.
          curl -fsSL "https://github.com/pufferffish/wireproxy/releases/download/${wp_tag}/checksums.txt" -o "${work}/wp.sums"
          wp_arc_amd64="$(sum_for "${work}/wp.sums" "wireproxy_linux_amd64.tar.gz")"
          wp_arc_arm64="$(sum_for "${work}/wp.sums" "wireproxy_linux_arm64.tar.gz")"
          curl -fsSL "https://github.com/pufferffish/wireproxy/releases/download/${wp_tag}/wireproxy_linux_amd64.tar.gz" -o "${work}/wp.amd64.tar.gz"
          curl -fsSL "https://github.com/pufferffish/wireproxy/releases/download/${wp_tag}/wireproxy_linux_arm64.tar.gz" -o "${work}/wp.arm64.tar.gz"
          echo "${wp_arc_amd64}  ${work}/wp.amd64.tar.gz" | sha256sum -c -
          echo "${wp_arc_arm64}  ${work}/wp.arm64.tar.gz" | sha256sum -c -
          tar -xzf "${work}/wp.amd64.tar.gz" -C "${work}" wireproxy && mv "${work}/wireproxy" "${work}/wireproxy.amd64"
          tar -xzf "${work}/wp.arm64.tar.gz" -C "${work}" wireproxy && mv "${work}/wireproxy" "${work}/wireproxy.arm64"
          wp_bin_amd64="$(sha256sum "${work}/wireproxy.amd64" | awk '{print $1}')"
          wp_bin_arm64="$(sha256sum "${work}/wireproxy.arm64" | awk '{print $1}')"

          # Smoke-test the binaries that match this runner (amd64): the downloads
          # are already verified, so this only catches a release whose layout or
          # ABI changed. The arm64 assets are pinned by checksum here and are
          # exercised by the arm64 release build.
          chmod +x "${work}/wgcf.amd64" "${work}/wireproxy.amd64"
          "${work}/wgcf.amd64" help >/dev/null 2>&1 \
            || { echo "::error::wgcf ${wgcf_tag} did not run"; exit 1; }
          "${work}/wireproxy.amd64" --version >/dev/null 2>&1 || "${work}/wireproxy.amd64" --help >/dev/null 2>&1 \
            || { echo "::error::wireproxy ${wp_tag} did not run"; exit 1; }

          {
            echo "changed=true"
            echo "branch=${branch}"
            echo "cur_wgcf=${cur_wgcf}"
            echo "cur_wp=${cur_wp}"
            echo "wgcf_tag=${wgcf_tag}"
            echo "wgcf_ver=${wgcf_ver}"
            echo "wgcf_sha_amd64=${wgcf_sha_amd64}"
            echo "wgcf_sha_arm64=${wgcf_sha_arm64}"
            echo "wp_tag=${wp_tag}"
            echo "wp_ver=${wp_ver}"
            echo "wp_arc_amd64=${wp_arc_amd64}"
            echo "wp_bin_amd64=${wp_bin_amd64}"
            echo "wp_arc_arm64=${wp_arc_arm64}"
            echo "wp_bin_arm64=${wp_bin_arm64}"
          } >> "$GITHUB_OUTPUT"

  pull-request:
    name: Open the pull request
    needs: find
    if: ${{ needs.find.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ needs.find.outputs.branch }}
      CUR_WGCF: ${{ needs.find.outputs.cur_wgcf }}
      CUR_WP: ${{ needs.find.outputs.cur_wp }}
      WGCF_TAG: ${{ needs.find.outputs.wgcf_tag }}
      WGCF_VER: ${{ needs.find.outputs.wgcf_ver }}
      WGCF_SHA_AMD64: ${{ needs.find.outputs.wgcf_sha_amd64 }}
      WGCF_SHA_ARM64: ${{ needs.find.outputs.wgcf_sha_arm64 }}
      WP_TAG: ${{ needs.find.outputs.wp_tag }}
      WP_VER: ${{ needs.find.outputs.wp_ver }}
      WP_ARC_AMD64: ${{ needs.find.outputs.wp_arc_amd64 }}
      WP_BIN_AMD64: ${{ needs.find.outputs.wp_bin_amd64 }}
      WP_ARC_ARM64: ${{ needs.find.outputs.wp_arc_arm64 }}
      WP_BIN_ARM64: ${{ needs.find.outputs.wp_bin_arm64 }}

    steps:
      - name: Require AUTOUPDATE_TOKEN
        env:
          AUTOUPDATE_TOKEN: ${{ secrets.AUTOUPDATE_TOKEN }}
        run: |
          [ -n "$AUTOUPDATE_TOKEN" ] || { echo "::error::The AUTOUPDATE_TOKEN secret is not set."; exit 1; }

      # A fresh checkout: nothing the verification job ran can have touched it.
      - name: Checkout the warp branch
        uses: actions/checkout@v7
        with:
          ref: warp
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the verified values
        run: |
          set -euo pipefail
          for tag in "$WGCF_TAG" "$WP_TAG"; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad tag: ${tag}"; exit 1; }
          done
          [ "$WGCF_VER" = "${WGCF_TAG#v}" ] && [ "$WP_VER" = "${WP_TAG#v}" ] || { echo "::error::version does not match tag"; exit 1; }
          for sum in "$WGCF_SHA_AMD64" "$WGCF_SHA_ARM64" "$WP_ARC_AMD64" "$WP_BIN_AMD64" "$WP_ARC_ARM64" "$WP_BIN_ARM64"; do
            [[ "$sum" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad checksum: ${sum}"; exit 1; }
          done

      - name: Rewrite the pins
        run: |
          python3 warp/update-helper-pins.py
          git diff --quiet && { echo "::error::The pins did not change."; exit 1; }
          git diff --stat

      - name: Open a pull request and arm auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTOUPDATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add src/base/bittorrent/warpengine.cpp warp/THIRD-PARTY-NOTICES.md
          git commit -m "Update WARP engine helpers (wgcf ${WGCF_VER}, wireproxy ${WP_VER})"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "$BRANCH"

          if ! gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            body="$(mktemp)"
            printf '%s\n' \
              "Automated bump of the bundled Cloudflare WARP engine helpers." \
              "" \
              "* wgcf: \`${CUR_WGCF}\` -> \`${WGCF_VER}\`" \
              "* wireproxy: \`${CUR_WP}\` -> \`${WP_VER}\`" \
              "" \
              "Checksums are taken from each release's published \`checksums.txt\`; the binaries were downloaded, verified and run on the CI runner before this pull request was opened. Auto-merge is armed: GitHub merges this PR after the required checks pass and the review bot approves the head commit, and the merge publishes a build with the new pins." \
              > "$body"
            gh pr create \
              --base warp --head "$BRANCH" \
              --title "Update WARP engine helpers (wgcf ${WGCF_VER}, wireproxy ${WP_VER})" \
              --body-file "$body"
          fi

          warp/arm-automerge.sh "$BRANCH" squash
          echo "Opened $(gh pr view "$BRANCH" --json url --jq .url) with auto-merge armed."
