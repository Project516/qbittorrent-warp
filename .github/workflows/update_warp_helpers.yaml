name: Update WARP engine helpers

# Keeps the bundled Cloudflare WARP engine helpers current without manual work,
# the same way auto_update.yaml tracks upstream qBittorrent. The fork does not
# ship the helpers; it pins their versions, download URLs and SHA-256 sums in
# src/base/bittorrent/warpengine.cpp and the client downloads and verifies them
# at runtime (see warp/THIRD-PARTY-NOTICES.md). On a schedule this finds the
# latest release of each helper, reads the published checksums, runs the
# binaries once on the runner, rewrites the pins, and opens a pull request that
# is merged automatically when it is clean.
#
# Helpers tracked:
#   * wgcf      - ViRb3/wgcf            (the asset is the linux/amd64 binary)
#   * wireproxy - pufferffish/wireproxy (the asset is a .tar.gz of the binary)
#
# Like auto_update.yaml the merge uses the built-in GITHUB_TOKEN, so it does not
# itself trigger CI; release.yaml picks the change up through its workflow_run
# trigger and publishes a build with the new pins compiled in. To gate the merge
# on CI instead, leave the pull request for manual review (see the merge step).

on:
  schedule:
    - cron: "0 7 * * 1"   # every Monday at 07:00 UTC, after the upstream sync
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-warp-helpers
  cancel-in-progress: false

jobs:
  update:
    name: Bump wgcf and wireproxy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the warp branch
        uses: actions/checkout@v6
        with:
          ref: warp
          fetch-depth: 0

      - name: Bump the helper pins and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          src="src/base/bittorrent/warpengine.cpp"

          # Latest releases and the versions currently pinned in the source.
          wgcf_tag="$(gh api repos/ViRb3/wgcf/releases/latest --jq .tag_name)"
          wp_tag="$(gh api repos/pufferffish/wireproxy/releases/latest --jq .tag_name)"
          wgcf_ver="${wgcf_tag#v}"
          wp_ver="${wp_tag#v}"
          cur_wgcf="$(grep -oP '(?<=// wgcf )\S+' "$src" | head -1)"
          cur_wp="$(grep -oP '(?<=// wireproxy )\S+' "$src" | head -1)"
          echo "wgcf: pinned ${cur_wgcf}, latest ${wgcf_ver}"
          echo "wireproxy: pinned ${cur_wp}, latest ${wp_ver}"

          if [ "$wgcf_ver" = "$cur_wgcf" ] && [ "$wp_ver" = "$cur_wp" ]; then
            echo "Both helpers are already up to date; nothing to do."
            exit 0
          fi

          work="$(mktemp -d)"

          # wgcf: the release asset is the linux/amd64 binary itself.
          wgcf_asset="wgcf_${wgcf_ver}_linux_amd64"
          wgcf_url="https://github.com/ViRb3/wgcf/releases/download/${wgcf_tag}/${wgcf_asset}"
          curl -fsSL "https://github.com/ViRb3/wgcf/releases/download/${wgcf_tag}/checksums.txt" -o "${work}/wgcf.sums"
          wgcf_sha="$(awk -v f="$wgcf_asset" '{n=$2; sub(/^\*/, "", n); if (n == f) print $1}' "${work}/wgcf.sums")"
          [ -n "$wgcf_sha" ] || { echo "::error::no checksum for ${wgcf_asset}"; exit 1; }
          curl -fsSL "$wgcf_url" -o "${work}/wgcf"
          echo "${wgcf_sha}  ${work}/wgcf" | sha256sum -c -

          # wireproxy: the release asset is a .tar.gz holding the binary. Pin both
          # the archive sum (verified before unpacking) and the binary sum
          # (verified before execution), exactly as warpengine.cpp checks them.
          wp_asset="wireproxy_linux_amd64.tar.gz"
          wp_url="https://github.com/pufferffish/wireproxy/releases/download/${wp_tag}/${wp_asset}"
          curl -fsSL "https://github.com/pufferffish/wireproxy/releases/download/${wp_tag}/checksums.txt" -o "${work}/wp.sums"
          wp_arc="$(awk -v f="$wp_asset" '{n=$2; sub(/^\*/, "", n); if (n == f) print $1}' "${work}/wp.sums")"
          [ -n "$wp_arc" ] || { echo "::error::no checksum for ${wp_asset}"; exit 1; }
          curl -fsSL "$wp_url" -o "${work}/wp.tar.gz"
          echo "${wp_arc}  ${work}/wp.tar.gz" | sha256sum -c -
          tar -xzf "${work}/wp.tar.gz" -C "${work}" wireproxy
          wp_bin="$(sha256sum "${work}/wireproxy" | awk '{print $1}')"

          # Smoke-test the way the client uses them: the downloads above are
          # already verified, so just run each binary on the runner (linux/amd64,
          # the release target) to catch a release whose layout or ABI changed.
          chmod +x "${work}/wgcf" "${work}/wireproxy"
          "${work}/wgcf" help >/dev/null 2>&1 \
            || { echo "::error::wgcf ${wgcf_tag} did not run"; exit 1; }
          "${work}/wireproxy" --version >/dev/null 2>&1 || "${work}/wireproxy" --help >/dev/null 2>&1 \
            || { echo "::error::wireproxy ${wp_tag} did not run"; exit 1; }

          WGCF_TAG="$wgcf_tag" WGCF_VER="$wgcf_ver" WGCF_SHA="$wgcf_sha" \
          WP_TAG="$wp_tag" WP_VER="$wp_ver" WP_ARC="$wp_arc" WP_BIN="$wp_bin" \
            python3 warp/update-helper-pins.py

          if git diff --quiet; then
            echo "Pins already match the latest releases; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="update-warp-helpers/wgcf-${wgcf_ver}-wireproxy-${wp_ver}"
          git checkout -b "$branch"
          git add "$src" warp/THIRD-PARTY-NOTICES.md
          git commit -m "Update WARP engine helpers (wgcf ${wgcf_ver}, wireproxy ${wp_ver})"
          git push --force origin "$branch"

          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            printf '%s\n' \
              "Automated bump of the bundled Cloudflare WARP engine helpers." \
              "" \
              "* wgcf: \`${cur_wgcf}\` -> \`${wgcf_ver}\`" \
              "* wireproxy: \`${cur_wp}\` -> \`${wp_ver}\`" \
              "" \
              "Checksums are taken from each release's published \`checksums.txt\`; the binaries were downloaded, verified and run on the CI runner before this pull request was opened. It is merged automatically when it has no conflicts." \
              > "${work}/pr-body.md"
            gh pr create \
              --base warp --head "$branch" \
              --title "Update WARP engine helpers (wgcf ${wgcf_ver}, wireproxy ${wp_ver})" \
              --body-file "${work}/pr-body.md"
          fi

          # GitHub computes mergeability asynchronously; wait for it to settle.
          state="UNKNOWN"
          for _ in $(seq 1 12); do
            state="$(gh pr view "$branch" --json mergeable --jq .mergeable)"
            [ "$state" != "UNKNOWN" ] && break
            sleep 6
          done
          echo "Mergeable state: $state"

          if [ "$state" = "MERGEABLE" ]; then
            gh pr merge "$branch" --merge --delete-branch
            echo "Merged the helper bump into warp."
          else
            echo "::warning::the helper bump does not merge cleanly (state: ${state}); leaving the pull request open for review."
          fi
