name: Cancel closed PR runs

# Stops CI that is still queued or running for a pull request that has just
# been closed or merged, so it does not burn minutes or fail on a deleted branch.

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  cancel:
    name: Cancel runs
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-slim
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Cancel pull request runs on the branch
        run: |
          for status in queued in_progress; do
            gh run list --branch "$BRANCH" --event pull_request --status "$status" \
              --json databaseId --jq '.[].databaseId'
          done | { grep -vx "$GITHUB_RUN_ID" || true; } | xargs -r -n1 gh run cancel
